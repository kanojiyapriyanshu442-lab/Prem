<!DOCTYPE html>
<html>
<head>
  <title>I'm Sorry ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      overflow: hidden;
    }

    .box {
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 80%;
    }

    h1 {
      color: #ff3f7f;
      font-size: 45px;
    }

    p {
      color: #555;
      font-size: 20px;
      line-height: 1.6;
    }

    button {
      border: none;
      background: #ff3f7f;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 20px;
      color: #ff3f7f;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>I'm Sorry ❤️</h1>

    <p>
      I'm really sorry 🥺<br>
      Please forgive me.<br>
      You mean so much to me. ❤️
    </p>

    <button onclick="i love you()">
      Forgive Me? 💕
    </button>

    <div id="I REALLY LOVE YOU MY LABBOO">
      Thank you ❤️ I promise to make it up to you! 🥰
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
